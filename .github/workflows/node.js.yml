name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Syntax and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # Every server file parses - including the ones only required lazily,
      # which the startup check below would never load.
      - name: Server syntax
        run: |
          for file in server.js src/*.js src/lib/*.js src/lib/store/*.js src/routes/*.js scripts/*.js; do
            node --check "$file"
          done

      - name: Install dependencies
        run: npm ci

      - name: Frontend type check
        run: npm run typecheck

  startup:
    name: Server starts (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The hosting's Node may be older than ours: the server must start on all.
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install server dependencies
        run: npm ci --ignore-scripts
      - name: Health endpoint answers
        run: |
          node server.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/api/health && exit 0
            sleep 1
          done
          cat /tmp/server.log
          exit 1

  suite:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 22.x, not 20.x: tests/matching.check.js imports web/src/lib/pixelMatch.ts
      # directly (the same code the browser runs), and Node 20 cannot read .ts.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # smoke.test.js checks the DOM wiring in src/public/index.html, a build
      # output committed only on main (by the "build" workflow). Pull-request
      # branches lack it, and without it the server fails - so build it here.
      - name: Build frontend
        run: npm run build

      # No .env and no src/data/settings.local.json on the runner: the store is
      # the file store and Odoo is not configured, so the idempotency test runs
      # for real instead of skipping itself (its skip protects real Odoo sales).
      - name: Run test suite
        run: npm test
