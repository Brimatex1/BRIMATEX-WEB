name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint and Validate
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: 18.x

    - name: Check syntax
      run: |
        node --check server.js
        node --check src/server.js
        for file in src/lib/*.js; do node --check "$file"; done

    - name: Validate structure
      run: |
        [ -f "src/lib/auth.js" ] || exit 1
        [ -f "src/lib/odoo.js" ] || exit 1
        [ -f "src/lib/whatsapp.js" ] || exit 1
        [ -f "src/public/index.html" ] || exit 1
        [ -f "src/data/demo-products.json" ] || exit 1
        echo "✅ All required files present"

  test:
    name: Test Server (${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Check Node.js version
      run: node --version

    - name: Test server startup
      run: |
        timeout 3 node server.js || true
        echo "✅ Server starts without errors"

    - name: Test API health endpoint
      run: |
        node server.js > /tmp/server.log 2>&1 &
        SERVER_PID=$!
        sleep 2
        curl -f http://localhost:3000/api/health || exit 1
        kill $SERVER_PID || true
        echo "✅ Health endpoint works"
