# بناء واجهة الموقع وإيداع ناتجها في المستودع.
#
# لماذا نودع ناتج بناء في git — وهو ما لا يُفعل عادةً:
#
# المضيف (Libyan Spider cPanel، CloudLinux) لا يستطيع بناء الواجهة إطلاقاً.
# Rollup 4 يحمل مكوّناً أصلياً يتطلّب GLIBC 2.29، والمضيف أقدم:
#
#     /lib64/libm.so.6: version `GLIBC_2.29' not found
#     (required by @rollup/rollup-linux-x64-gnu)
#
# فالملفات المبنيّة لا سبيل لها إلى المضيف إلا محمولةً. والبديل — إرسالها عبر
# SSH من هنا — يعني مفتاحاً خاصاً في أسرار المستودع: سرٌّ دائم يُدار ويُحرس،
# مقابل توفير ضغطتين. اخترنا الضغطتين.
#
# فالمسار كله بلا سرّ واحد: هذا الوركفلو يستعمل GITHUB_TOKEN المدمج، والنشر
# إلى المضيف يتمّ من لوحة cPanel كما رأيته يعمل:
#
#     Git™ Version Control ← Manage ← Update from Remote ← Deploy HEAD Commit
#
# و.cpanel.yml ينادي scripts/deploy.sh بـSKIP_BUILD=1، فيكتفي المضيف بالنسخ
# وإعادة التشغيل — لا يحاول بناءً يعرف أنه سيفشل.
name: بناء واجهة الموقع

on:
  push:
    branches: [ main ]
    # بلا هذا يودع الوركفلو ناتجاً فيُشغّل نفسه فيودع ثانيةً — حلقة لا تنتهي.
    # ورسالة الإيداع تحمل [skip ci] أيضاً، حزاماً ثانياً.
    paths-ignore:
      - 'src/public/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

# بناءان متوازيان يودعان في الفرع نفسه = تضارب دفع. واحدٌ في وقت واحد.
concurrency:
  group: build-frontend
  cancel-in-progress: false

jobs:
  build:
    name: بناء وإيداع
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: تثبيت الاعتماديات
        run: npm ci

      - name: بناء الواجهة
        run: npm run build

      - name: التحقّق من ناتج البناء
        # الخادم يسقط بـENOENT بلا هذا الملف، فلا نودع بناءً ناقصاً.
        run: |
          [ -f src/public/index.html ] || { echo "✗ لا ناتج بناء"; exit 1; }
          echo "✅ ناتج البناء حاضر"
          du -sh src/public

      - name: إيداع الناتج
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ‎uploads/‎ صور يرفعها المدير على المضيف — ليست ناتج بناء ولا تُودع.
          git add src/public
          if git diff --cached --quiet; then
            echo "الناتج لم يتغيّر — لا إيداع"
            exit 0
          fi

          git commit -m "build(web): ناتج بناء الواجهة من ${GITHUB_SHA::7} [skip ci]"
          git push
          echo "✅ أُودع الناتج — انشره من cPanel: Update from Remote ثم Deploy HEAD Commit"
