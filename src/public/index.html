<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛏️ بريماتكس - متجر المراتب الذكي</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <h1 class="logo">🛏️ بريماتكس</h1>
      <nav class="nav">
        <button class="nav-btn" onclick="showSection('shop')">🏪 المتجر</button>
        <button class="nav-btn" style="position: relative;" onclick="showSection('cart')">
          🛒 السلة
          <span class="cart-badge" id="cart-count" style="display:none;">0</span>
        </button>
        <button class="nav-btn" onclick="showSection('auth')">👤 حسابي</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- Section: Shop -->
    <section id="shop" class="section active">
      <h2>🏪 متجر المراتب والمخدات الفاخرة</h2>
      <div id="products" class="products-grid">
        <p>⏳ جاري تحميل المنتجات...</p>
      </div>
    </section>

    <!-- Section: Cart -->
    <section id="cart" class="section">
      <h2>🛒 سلة الشراء</h2>
      <div class="cart-section">
        <div id="cart-items"></div>
        <div id="cart-total" style="display:none;">
          <div class="cart-total">
            <span>الإجمالي:</span>
            <span id="total-price">0 ر.س</span>
          </div>
          <button class="btn btn-primary" onclick="checkout()" style="margin-top: 1.5rem;">
            💳 إتمام الطلب
          </button>
        </div>
      </div>
    </section>

    <!-- Section: Auth -->
    <section id="auth" class="section">
      <div class="auth-container">
        <div id="login-form" class="auth-form">
          <h2>🔐 تسجيل الدخول</h2>
          <input type="text" id="login-phone" placeholder="رقم الهاتف" class="input">
          <input type="password" id="login-password" placeholder="كلمة المرور" class="input">
          <button onclick="handleLogin()" class="btn btn-primary">دخول</button>
          <p><a href="#" onclick="toggleAuthForm(event)">✨ إنشاء حساب جديد</a></p>
        </div>

        <div id="register-form" class="auth-form" style="display:none;">
          <h2>✨ إنشاء حساب جديد</h2>
          <input type="text" id="register-name" placeholder="الاسم" class="input">
          <input type="text" id="register-phone" placeholder="رقم الهاتف" class="input">
          <input type="password" id="register-password" placeholder="كلمة المرور" class="input">
          <button onclick="handleRegister()" class="btn btn-primary">تسجيل</button>
          <p><a href="#" onclick="toggleAuthForm(event)">🔐 لديّ حساب بالفعل</a></p>
        </div>

        <div id="user-info" class="user-info" style="display:none;">
          <h2>✅ مرحباً <span id="user-name"></span></h2>
          <p>📱 رقم الهاتف: <span id="user-phone"></span></p>
          <button onclick="handleLogout()" class="btn btn-secondary" style="margin-top: 1.5rem;">تسجيل الخروج</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>🛏️ بريماتكس - تجربة 100 ليلة مجاناً | 🚚 توصيل مجاني | 🔒 ضمان حتى 12 سنة</p>
  </footer>

  <script>
    let authToken = localStorage.getItem('auth_token');
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let products = [];

    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        const data = await res.json();
        products = data.products || [];

        const html = products.map(p => `
          <div class="product-card">
            <h3>${p.name}</h3>
            <p class="price">${p.price} ر.س</p>
            <p class="sku">📦 ${p.sku}</p>
            <button class="btn btn-primary" onclick="addToCart(${p.id})">🛒 إضافة للسلة</button>
          </div>
        `).join('');

        document.getElementById('products').innerHTML = html || '<p>❌ لا توجد منتجات</p>';
      } catch (err) {
        document.getElementById('products').innerHTML = '<p>❌ خطأ في تحميل المنتجات</p>';
      }
    }

    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      if (!product) return;

      const existingItem = cart.find(i => i.id === productId);
      if (existingItem) {
        existingItem.quantity++;
      } else {
        cart.push({ ...product, quantity: 1 });
      }

      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartUI();
      alert(`✅ تم إضافة "${product.name}" للسلة`);
    }

    function removeFromCart(productId) {
      cart = cart.filter(item => item.id !== productId);
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartUI();
    }

    function updateCartUI() {
      const cartContainer = document.getElementById('cart-items');
      const cartTotalDiv = document.getElementById('cart-total');
      const cartBadge = document.getElementById('cart-count');

      if (cart.length === 0) {
        cartContainer.innerHTML = '<div class="empty-cart">🛒 سلتك فارغة</div>';
        cartTotalDiv.style.display = 'none';
        cartBadge.style.display = 'none';
      } else {
        const cartHTML = cart.map(item => `
          <div class="cart-item">
            <div class="cart-item-info">
              <h4>${item.name}</h4>
              <p>الكمية: ${item.quantity}</p>
            </div>
            <div class="cart-item-price">${item.price * item.quantity} ر.س</div>
            <button class="btn btn-small" onclick="removeFromCart(${item.id})">🗑️ حذف</button>
          </div>
        `).join('');

        cartContainer.innerHTML = cartHTML;
        cartTotalDiv.style.display = 'block';

        const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        document.getElementById('total-price').textContent = `${total} ر.س`;

        cartBadge.textContent = cart.length;
        cartBadge.style.display = 'flex';
      }
    }

    function checkout() {
      if (cart.length === 0) {
        alert('❌ السلة فارغة!');
        return;
      }

      if (!authToken) {
        alert('⚠️ يرجى تسجيل الدخول أولاً');
        showSection('auth');
        return;
      }

      const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      alert(`✅ تم إنشاء الطلب بنجاح!\n\nالمبلغ الإجمالي: ${total} ر.س\n\n📧 سيتم إرسال تفاصيل الطلب إلى رقم هاتفك`);

      cart = [];
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartUI();
      showSection('shop');
    }

    function toggleAuthForm(e) {
      e.preventDefault();
      document.getElementById('login-form').style.display =
        document.getElementById('login-form').style.display === 'none' ? 'block' : 'none';
      document.getElementById('register-form').style.display =
        document.getElementById('register-form').style.display === 'none' ? 'block' : 'none';
    }

    async function handleRegister() {
      const name = document.getElementById('register-name').value;
      const phone = document.getElementById('register-phone').value;
      const password = document.getElementById('register-password').value;

      if (!name || !phone || !password) {
        alert('❌ يرجى ملء جميع الحقول');
        return;
      }

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone, password })
        });
        const data = await res.json();

        if (data.token) {
          localStorage.setItem('auth_token', data.token);
          authToken = data.token;
          updateAuthUI();
          alert('✅ تم التسجيل بنجاح!');
        } else {
          alert(data.error || '❌ خطأ في التسجيل');
        }
      } catch (err) {
        alert('❌ خطأ في الاتصال');
      }
    }

    async function handleLogin() {
      const phone = document.getElementById('login-phone').value;
      const password = document.getElementById('login-password').value;

      if (!phone || !password) {
        alert('❌ يرجى إدخال رقم الهاتف وكلمة المرور');
        return;
      }

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });
        const data = await res.json();

        if (data.token) {
          localStorage.setItem('auth_token', data.token);
          authToken = data.token;
          updateAuthUI();
          alert('✅ تم الدخول بنجاح!');
        } else {
          alert(data.error || '❌ خطأ في بيانات الدخول');
        }
      } catch (err) {
        alert('❌ خطأ في الاتصال');
      }
    }

    function handleLogout() {
      localStorage.removeItem('auth_token');
      authToken = null;
      updateAuthUI();
    }

    function updateAuthUI() {
      if (authToken) {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('register-form').style.display = 'none';
        document.getElementById('user-info').style.display = 'block';

        fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${authToken}` }
        }).then(r => r.json()).then(data => {
          if (data.user) {
            document.getElementById('user-name').textContent = data.user.name;
            document.getElementById('user-phone').textContent = data.user.phone;
          }
        });
      } else {
        document.getElementById('login-form').style.display = 'block';
        document.getElementById('register-form').style.display = 'none';
        document.getElementById('user-info').style.display = 'none';
      }
    }

    function showSection(id) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    loadProducts();
    updateAuthUI();
    updateCartUI();
  </script>
</body>
</html>
