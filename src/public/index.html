<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛏️ بريماتكس - متجر المراتب الذكي</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <h1 class="logo">🛏️ بريماتكس</h1>
      <nav class="nav">
        <button class="nav-btn" onclick="showSection('shop')">المتجر</button>
        <button class="nav-btn" onclick="showSection('auth')">حسابي</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- Section: Shop -->
    <section id="shop" class="section active">
      <h2>متجر المراتب والمخدات</h2>
      <div id="products" class="products-grid">
        <p>جاري تحميل المنتجات...</p>
      </div>
    </section>

    <!-- Section: Auth -->
    <section id="auth" class="section">
      <div class="auth-container">
        <div id="login-form" class="auth-form">
          <h2>تسجيل الدخول</h2>
          <input type="text" id="login-phone" placeholder="رقم الهاتف" class="input">
          <input type="password" id="login-password" placeholder="كلمة المرور" class="input">
          <button onclick="handleLogin()" class="btn btn-primary">دخول</button>
          <p><a href="#" onclick="toggleAuthForm(event)">إنشاء حساب جديد</a></p>
        </div>

        <div id="register-form" class="auth-form" style="display:none;">
          <h2>إنشاء حساب جديد</h2>
          <input type="text" id="register-name" placeholder="الاسم" class="input">
          <input type="text" id="register-phone" placeholder="رقم الهاتف" class="input">
          <input type="password" id="register-password" placeholder="كلمة المرور" class="input">
          <button onclick="handleRegister()" class="btn btn-primary">تسجيل</button>
          <p><a href="#" onclick="toggleAuthForm(event)">لديّ حساب بالفعل</a></p>
        </div>

        <div id="user-info" class="user-info" style="display:none;">
          <h2 id="user-name"></h2>
          <p>رقم الهاتف: <span id="user-phone"></span></p>
          <button onclick="handleLogout()" class="btn btn-secondary">تسجيل الخروج</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>🛏️ بريماتكس - تجربة 100 ليلة | توصيل مجاني | ضمان حتى 12 سنة</p>
  </footer>

  <script>
    let authToken = localStorage.getItem('auth_token');

    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        const data = await res.json();
        const products = data.products || [];

        const html = products.map(p => `
          <div class="product-card">
            <h3>${p.name}</h3>
            <p class="price">${p.price} ر.س</p>
            <p class="sku">SKU: ${p.sku}</p>
            <button class="btn btn-primary" onclick="addToCart(${p.id})">إضافة للسلة</button>
          </div>
        `).join('');

        document.getElementById('products').innerHTML = html || '<p>لا توجد منتجات</p>';
      } catch (err) {
        document.getElementById('products').innerHTML = '<p>خطأ في تحميل المنتجات</p>';
      }
    }

    function toggleAuthForm(e) {
      e.preventDefault();
      document.getElementById('login-form').style.display =
        document.getElementById('login-form').style.display === 'none' ? 'block' : 'none';
      document.getElementById('register-form').style.display =
        document.getElementById('register-form').style.display === 'none' ? 'block' : 'none';
    }

    async function handleRegister() {
      const name = document.getElementById('register-name').value;
      const phone = document.getElementById('register-phone').value;
      const password = document.getElementById('register-password').value;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone, password })
        });
        const data = await res.json();

        if (data.token) {
          localStorage.setItem('auth_token', data.token);
          authToken = data.token;
          updateAuthUI();
          alert('تم التسجيل بنجاح!');
        } else {
          alert(data.error || 'خطأ في التسجيل');
        }
      } catch (err) {
        alert('خطأ في الاتصال');
      }
    }

    async function handleLogin() {
      const phone = document.getElementById('login-phone').value;
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });
        const data = await res.json();

        if (data.token) {
          localStorage.setItem('auth_token', data.token);
          authToken = data.token;
          updateAuthUI();
          alert('تم الدخول بنجاح!');
        } else {
          alert(data.error || 'خطأ في بيانات الدخول');
        }
      } catch (err) {
        alert('خطأ في الاتصال');
      }
    }

    function handleLogout() {
      localStorage.removeItem('auth_token');
      authToken = null;
      updateAuthUI();
    }

    function updateAuthUI() {
      if (authToken) {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('register-form').style.display = 'none';
        document.getElementById('user-info').style.display = 'block';

        fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${authToken}` }
        }).then(r => r.json()).then(data => {
          if (data.user) {
            document.getElementById('user-name').textContent = data.user.name;
            document.getElementById('user-phone').textContent = data.user.phone;
          }
        });
      } else {
        document.getElementById('login-form').style.display = 'block';
        document.getElementById('register-form').style.display = 'none';
        document.getElementById('user-info').style.display = 'none';
      }
    }

    function showSection(id) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function addToCart(productId) {
      alert(`تم إضافة المنتج #${productId} للسلة`);
    }

    loadProducts();
    updateAuthUI();
  </script>
</body>
</html>
